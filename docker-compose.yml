version: '3'

services:

  # ================================
  # 🌸 Nuxt SSR 前端
  # ================================
  mofukaze:
    build:
      context: ./mofukaze
      dockerfile: Dockerfile
    container_name: mofukaze
    expose:
      - "3000"
    environment:
      API_GATEWAY_URL: "http://api_gateway:3001"
      NODE_ENV: production
    depends_on:
      - api_gateway
    networks:
      - app-network
    volumes:
      - ./resource_service/resources:/resources

  # ================================
  # 🌸 Node API 网关
  # ================================
  api_gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    container_name: api_gateway
    expose:
      - "3001"
    environment:
      BLOG_SERVICE_URL: "http://blog_service:3002"
      NODE_ENV: production
      ADMIN_TOKEN: "114514"
    depends_on:
      - blog_service
    networks:
      - app-network
    volumes:
      - ./resource_service/resources:/resources

  # ================================
  # 🌸 Blog 后端服务
  # ================================
  blog_service:
    build:
      context: ./blog_service
      dockerfile: Dockerfile
    container_name: blog_service
    expose:
      - "3002"
    environment:
      NODE_ENV: production
      UPLOAD_URL: "http://mofukaze.me"
      UPLOAD_IMG_TEXT_DIR: "/media/img/text"
      UPLOAD_IMG_COVER_DIR: "/media/img/cover"
      UPLOAD_VIDEO_DIR: "/resources/video"
      UPLOAD_MUSIC_DIR: "/resources/music"
    networks:
      - app-network
    volumes:
      - ./resource_service/resources:/resources
      # - D:\web\media:/media:rw
      - /media:/media:rw


  # ================================
  # 🌸 外部 Nginx（入口）
  # ================================
  nginx:
    image: nginx:1.25
    container_name: nginx
    ports:
      - "80:80"       # ⭐ 改这里：直接映射公网 80
    volumes:
      - ./mofukaze/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./resource_service/resources:/resources
      - /media:/media:ro
      # - D:\web\media:/media:ro
    depends_on:
      - mofukaze
      - api_gateway
    networks:
      - app-network

# ================================
# 🌸 Docker 内部网络
# ================================
networks:
  app-network:
    driver: bridge
